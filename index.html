<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tragédia de Brumadinho: causas, consequências e impactos</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#23302a;--mu:#5d6b63;--pr:#2f6b46;--pr2:#1f4a31;--br:#7a5a3c;--ln:#dcd7cc;--nt:#fff6e0;--sh:0 6px 24px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a16;--sf:#1d2620;--tx:#e8ece9;--mu:#a2afa7;--pr:#6fbf8a;--pr2:#9bd7b0;--br:#c9a37c;--ln:#31403a;--nt:#2c2616;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141a16;--sf:#1d2620;--tx:#e8ece9;--mu:#a2afa7;--pr:#6fbf8a;--pr2:#9bd7b0;--br:#c9a37c;--ln:#31403a;--nt:#2c2616;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 Georgia,'Times New Roman',serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sf);border-bottom:1px solid var(--ln)}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;align-items:center;padding:8px 16px;overflow-x:auto;font:600 14px system-ui,sans-serif}
nav b{color:var(--pr);margin-right:10px;white-space:nowrap}
nav a{color:var(--tx);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap}
nav a:hover{background:var(--bg);color:var(--pr)}
.hero{background:linear-gradient(180deg,#1f3a2b,#3d5a45 55%,#7a5a3c);color:#fff;text-align:center;padding:90px 20px 0;position:relative;overflow:hidden}
.hero h1{font-size:clamp(28px,5vw,52px);line-height:1.15;max-width:850px;margin:0 auto 16px;animation:up .9s both}
.hero p{max-width:640px;margin:0 auto 28px;opacity:.9;animation:up 1.2s both}
.hero svg{display:block;width:100%;height:120px;margin-top:20px}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.btn,button{font:600 14px system-ui,sans-serif;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.d{background:#a33}
.hero .btn{background:#fff;color:#1f3a2b}
section{max-width:860px;margin:auto;padding:56px 20px 8px;animation:up .6s both}
section h2{font-size:clamp(26px,4vw,36px);color:var(--pr2);margin:0 0 6px}
section h2::after{content:"";display:block;width:56px;height:4px;background:var(--br);border-radius:2px;margin-top:8px}
h3{color:var(--br)}
img{max-width:100%;border-radius:12px}figure{margin:20px 0}figcaption{font-size:14px;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);padding:4px 24px;margin-top:20px}
.note{background:var(--nt);border-left:4px solid var(--br);padding:10px 16px;border-radius:8px;margin:16px 0;font-size:15px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font:15px system-ui,sans-serif}th,td{border:1px solid var(--ln);padding:8px 10px;text-align:left}th{background:var(--pr);color:#fff}
.bar{display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;font:14px system-ui,sans-serif;margin:6px 0}.bar i{display:block;height:16px;border-radius:8px;background:var(--pr)}
.ref{padding-left:18px;text-indent:-18px;font-size:15px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
footer{text-align:center;color:var(--mu);font:14px system-ui,sans-serif;padding:50px 20px 90px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;flex-wrap:wrap;justify-content:center;z-index:12;font:14px system-ui,sans-serif;align-items:center}
.ed{border:1px dashed var(--pr);border-radius:12px;padding:12px;margin:12px 0;background:var(--sf);font:14px system-ui,sans-serif}
.ed input,.ed textarea,.ed select{width:100%;font:inherit;padding:7px;margin:4px 0;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
.ed textarea{min-height:90px}
@media(max-width:600px){.bar{grid-template-columns:90px 1fr 50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><nav id="nav"></nav></header>
<main id="app"></main>
<footer>Projeto escolar · Conteúdo educativo sem fins lucrativos · Dados marcados com [verificar] precisam de confirmação em fonte oficial.</footer>
<div id="bar"></div>
<script id="data" type="application/json">{"s":[
{"id":"inicio","n":"Início","hero":1,"b":[]},
{"id":"desastre","n":"O desastre","t":"O que aconteceu em Brumadinho?","b":[
{"t":"text","v":"No dia 25 de janeiro de 2019, ocorreu a liberação de uma gigante onda de rejeitos de minério de ferro que destruiu a cidade de Brumadinho, atingindo espaços urbanos e rurais e contaminando o Rio Paraopeba, ocasionando 272 mortes."},
{"t":"text","v":"Cerca de 10 milhões de metros cúbicos de lama e rejeitos escaparam rapidamente da estrutura de mineração em menos de 5 minutos, destruindo tudo à frente e percorrendo aproximadamente 300 quilômetros pelo Rio Paraopeba. O desastre provocou diversos impactos econômicos severos nos municípios atingidos e resultou em acordos judiciais bilionários para a reparação dos danos, assinados com o poder público."},
{"t":"bar","v":"Mortes;272\nVolume (milhões de m³);10\nExtensão (centenas de km);3","c":"Números principais (valores do texto-base do projeto)"}]},
{"id":"causas","n":"Causas","t":"Quais foram as causas do desastre?","b":[
{"t":"h","v":"Liquefação dos rejeitos"},
{"t":"text","v":"A principal causa física associada ao acidente foi a liquefação dos rejeitos, um fenômeno em que o material sólido passa a se comportar como um fluido devido ao aumento da pressão da água em seus poros e à perda de resistência do material."},
{"t":"h","v":"Alteamento a montante"},
{"t":"text","v":"Outro fator importante foi o método de construção da barragem, conhecido como alteamento a montante. Esse modelo apresenta custos menores de construção, mas possui riscos de segurança maiores quando comparado a outros métodos, especialmente quando não há controle e monitoramento adequados."},
{"t":"h","v":"Falhas de gestão e segurança"},
{"t":"text","v":"Também foram identificadas falhas relacionadas à manutenção, fiscalização, monitoramento e gestão da segurança da estrutura, fatores que contribuíram para o rompimento."}]},
{"id":"ambientais","n":"Ambientais","t":"Impactos ambientais","b":[
{"t":"text","v":"Os rejeitos percorreram cerca de 300 quilômetros pelo Rio Paraopeba, contaminando suas águas e atingindo áreas urbanas e rurais."},
{"t":"note","v":"Em construção: acrescente aqui dados sobre qualidade da água, vegetação e fauna com fonte oficial (IBAMA, Governo de Minas, estudos acadêmicos). [verificar]"}]},
{"id":"sociais","n":"Sociais","t":"Impactos sociais","b":[
{"t":"text","v":"O rompimento causou 272 mortes e afetou famílias e comunidades urbanas e rurais, que perderam moradias, vínculos e modos de vida."},
{"t":"note","v":"Em construção: inclua dados sobre famílias atingidas e atendimento às vítimas com fonte oficial (Ministério Público, Defensoria). [verificar]"}]},
{"id":"economicos","n":"Econômicos","t":"Impactos econômicos","b":[
{"t":"text","v":"O desastre provocou impactos econômicos severos nos municípios atingidos."},
{"t":"note","v":"Em construção: valores de perdas, arrecadação e emprego precisam de fonte oficial. [verificar]"}]},
{"id":"reparacao","n":"Reparação","t":"Reparação","b":[
{"t":"text","v":"O desastre resultou em acordos judiciais bilionários para a reparação dos danos, assinados com o poder público."},
{"t":"note","v":"Em construção: valores, data e partes do acordo devem ser copiados de fonte oficial (Governo de Minas Gerais, Ministério Público). [verificar]"}]},
{"id":"escola","n":"Na escola","t":"Como a escola pode aplicar o ocorrido de Brumadinho na grade escolar","b":[
{"t":"note","v":"Atenção: algumas atividades abaixo citam números diferentes dos usados nas outras páginas (por exemplo, 12 milhões de m³ e 270 mortos, contra 10 milhões de m³ e 272 mortes). Confirme os valores em fonte oficial antes de aplicar. Dados sobre multas, lucros e número de barragens em risco também precisam de verificação. [verificar]"},
{"t":"h","v":"1. Língua Portuguesa / Redação"},
{"t":"text","v":"6º e 7º ano: leitura de notícias e reportagens sobre o caso. Trabalhar o gênero textual: notícia versus opinião. Atividade: produzir um resumo da tragédia com quem, o quê, onde, quando.\n\n8º e 9º ano: análise de discurso. Como a Vale, as vítimas e o governo falaram sobre o caso? Estudo de cartas de familiares.\n\nEnsino Médio: gênero dissertativo-argumentativo. Tema ENEM: “A responsabilidade das mineradoras e a segurança de barragens no Brasil”, com argumentação e proposta de intervenção."},
{"t":"h","v":"2. Matemática"},
{"t":"text","v":"6º e 7º ano: números grandes e volume. Calcular: foram 12 milhões de m³ de rejeito. Quantas piscinas olímpicas é isso? Trabalhar escala e proporção.\n\n8º e 9º ano: estatística e gráficos. Analisar dados: 270 mortos, distância que a lama percorreu, velocidade. Criar gráficos de barra com o número de barragens em risco em MG.\n\nEnsino Médio: função e vazão. Calcular a velocidade da lama usando Física e Matemática. Matemática Financeira: valor da multa aplicada à Vale versus lucro da empresa. Juros e indenizações."},
{"t":"h","v":"3. História"},
{"t":"text","v":"6º e 7º ano: história da mineração em Minas Gerais, do ciclo do ouro até hoje. Por que Minas se chama Minas?\n\n8º e 9º ano: história industrial e o modelo de extrativismo no Brasil. Comparar Brumadinho com Mariana: um padrão histórico?\n\nEnsino Médio: Ditadura Militar e o projeto de desenvolvimento com grandes mineradoras. Neoliberalismo, privatização da Vale do Rio Doce e fiscalização do Estado."},
{"t":"h","v":"4. Geografia"},
{"t":"text","v":"6º e 7º ano: o que é bacia hidrográfica? Mapear o Rio Paraopeba. O que é rejeito de minério? Localizar Brumadinho no mapa de MG.\n\n8º e 9º ano: impacto ambiental e uso do solo. O que é barragem a montante e a jusante, e por que a de Brumadinho (a montante) era a mais perigosa? Estudar o mapa de risco.\n\nEnsino Médio: geopolítica das commodities. Para onde vai o minério de ferro do Brasil? Conflito entre desenvolvimento econômico e sustentabilidade. Legislação ambiental e licenciamento."},
{"t":"h","v":"5. Ciências / Biologia"},
{"t":"text","v":"6º e 7º ano: ecossistema e rio. O que acontece com a água e os peixes quando a lama chega? Cadeia alimentar quebrada.\n\n8º e 9º ano: poluição e bioacumulação. Metais pesados (ferro, manganês, chumbo) na água e no solo. Como isso afeta a saúde humana?\n\nEnsino Médio: ecologia avançada. Desequilíbrio ecológico, perda de biodiversidade na Mata Atlântica, recuperação de áreas degradadas. Saúde pública e doenças relacionadas à contaminação."},
{"t":"h","v":"6. Química"},
{"t":"text","v":"8º e 9º ano: o que é minério de ferro? Separação de misturas e rejeito. O que tem dentro da lama?\n\nEnsino Médio: química ambiental. pH da água, solubilidade de metais pesados, reações químicas no rio, análise de toxicidade e tratamento de água contaminada."},
{"t":"h","v":"7. Física"},
{"t":"text","v":"8º e 9º ano: força, massa e energia. Por que 12 milhões de m³ de lama destruíram tudo? Conceito de pressão e densidade.\n\nEnsino Médio: hidrostática e dinâmica dos fluidos. Por que barragens a montante rompem? Cálculo de pressão sobre a barragem, energia potencial da lama armazenada."},
{"t":"h","v":"8. Arte"},
{"t":"text","v":"Do 6º ano ao Ensino Médio: arte como memória e protesto. Analisar o memorial de Brumadinho, fotografias, músicas e documentários feitos sobre a tragédia. Atividade: criar um painel coletivo de luto e resistência com técnicas de colagem e pintura."},
{"t":"h","v":"9. Inglês"},
{"t":"text","v":"Do 8º ano ao Ensino Médio: leitura de reportagens internacionais sobre o caso (The Guardian, New York Times). Como o mundo viu Brumadinho? Vocabulário: dam, mudslide, accountability, mining disaster."},
{"t":"h","v":"10. Educação Física"},
{"t":"text","v":"Do 6º ano ao Ensino Médio: debate sobre o local onde a lama atingiu, o refeitório e áreas de lazer dos funcionários da Vale. Discussão sobre segurança no ambiente de trabalho e qualidade de vida."},
{"t":"h","v":"11. Sociologia e Filosofia (Ensino Médio)"},
{"t":"text","v":"Sociologia: quem são as vítimas? Impacto nas comunidades ribeirinhas, quilombolas e indígenas. Conceitos de justiça social, crime ambiental e movimentos sociais como o MAB (Movimento dos Atingidos por Barragens).\n\nFilosofia: ética empresarial. O lucro vale mais que vidas? Ética da responsabilidade de Hans Jonas. O que é crime doloso versus culposo no julgamento da Vale."},
{"t":"h","v":"Sugestões de trabalhos interdisciplinares"},
{"t":"text","v":"Maquete da bacia do Paraopeba (Geografia + Arte).\n\nJornal com gráficos e notícias (Português + Matemática).\n\nJúri simulado para julgar as responsabilidades (História + Sociologia)."}]},
{"id":"referencias","n":"Referências","t":"Referências","b":[
{"t":"note","v":"Lista de fontes a consultar. Confirme título, data e endereço de cada uma antes de citar formalmente. [verificar]"},
{"t":"ref","v":"Agência Nacional de Mineração (ANM) – gov.br/anm"},
{"t":"ref","v":"IBAMA – gov.br/ibama"},
{"t":"ref","v":"Governo de Minas Gerais – mg.gov.br"},
{"t":"ref","v":"Ministério Público de Minas Gerais – mpmg.mp.br"},
{"t":"ref","v":"Governo Federal – gov.br"},
{"t":"ref","v":"Artigos científicos sobre a ruptura da Barragem I (Córrego do Feijão), em bases como Google Acadêmico e SciELO. [adicionar]"}]}
]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let admin=false,editing=false,assets=null,artifact=null;
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'secao'+Date.now();
function blk(b){const v=b.v||'';
 if(b.t=='text')return v.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('');
 if(b.t=='h')return '<h3>'+esc(v)+'</h3>';
 if(b.t=='note')return '<div class="note">'+esc(v)+'</div>';
 if(b.t=='ref')return '<p class="ref">'+esc(v)+'</p>';
 if(b.t=='img')return '<figure><img src="'+esc(v)+'" alt="'+esc(b.c)+'" loading="lazy"><figcaption>'+esc(b.c)+'</figcaption></figure>';
 if(b.t=='link'&&/^https?:\/\//.test(v))return '<p><a class="btn" target="_blank" rel="noopener" href="'+esc(v)+'">'+esc(b.c||'Abrir')+' ↗</a></p>';
 if(b.t=='table'){const r=v.trim().split('\n').map(x=>x.split(';'));return '<div class="tw"><table><tr>'+r[0].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+r.slice(1).map(x=>'<tr>'+x.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>'}
 if(b.t=='bar'){const r=v.trim().split('\n').map(x=>x.split(';')),m=Math.max(...r.map(x=>+x[1]||0),1);return '<div class="card">'+r.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><i style="width:'+(100*(+x[1]||0)/m)+'%"></i><b>'+esc(x[1])+'</b></div>').join('')+'<p style="font-size:13px;color:var(--mu)">'+esc(b.c)+'</p></div>'}
 return ''}
function render(){
 $('#nav').innerHTML='<b>Brumadinho</b>'+D.s.map(s=>'<a href="#'+s.id+'">'+esc(s.n)+'</a>').join('');
 $('#app').innerHTML=D.s.map((s,i)=>s.hero?`<div class="hero" id="${s.id}"><h1>Tragédia de Brumadinho: causas, consequências e impactos</h1><p>Portal educativo sobre o rompimento da barragem em 25 de janeiro de 2019, em Brumadinho (MG): o que aconteceu, por que aconteceu e o que mudou para pessoas e para o meio ambiente.</p><a class="btn" href="#desastre">Começar a leitura</a><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 90Q200 30 400 70T800 50T1200 80V120H0Z" fill="#4c6b50"/><path d="M0 110Q300 60 600 95T1200 90V120H0Z" fill="#7a5a3c"/></svg></div>`+(editing?edTools(i):''):
 `<section id="${s.id}"><h2>${esc(s.t||s.n)}</h2>${editing?edSec(s,i):'<div>'+s.b.map(blk).join('')+'</div>'}</section>`).join('');
 bar()}
function edTools(i){return '<div class="tools" style="justify-content:center;padding:8px"><button class="g" onclick="mv('+i+',-1)">↑</button><button class="g" onclick="mv('+i+',1)">↓</button></div>'}
function edSec(s,i){const o=['text','h','note','img','table','bar','link','ref'],L={text:'Texto',h:'Subtítulo',note:'Destaque/aviso',img:'Imagem',table:'Tabela',bar:'Gráfico',link:'Link/vídeo/mapa',ref:'Referência'};
 return `<div class="tools"><button class="g" onclick="mv(${i},-1)">↑</button><button class="g" onclick="mv(${i},1)">↓</button><button class="d" onclick="delS(${i})">Excluir seção</button></div><input class="ed" style="width:100%;padding:8px" value="${esc(s.t||s.n)}" onchange="D.s[${i}].t=this.value;D.s[${i}].n=this.value.slice(0,22)">`+
 s.b.map((b,j)=>`<div class="ed"><select onchange="D.s[${i}].b[${j}].t=this.value;render()">${o.map(x=>`<option value="${x}"${x==b.t?' selected':''}>${L[x]}</option>`).join('')}</select>
 <textarea onchange="D.s[${i}].b[${j}].v=this.value" placeholder="${b.t=='table'?'Linhas; colunas separadas por ponto e vírgula':b.t=='bar'?'Rótulo;valor (uma por linha)':b.t=='img'?'URL da imagem ou envie um arquivo':'Conteúdo'}">${esc(b.v)}</textarea>
 ${['img','bar','link'].includes(b.t)?`<input placeholder="Legenda / rótulo / fonte" value="${esc(b.c)}" onchange="D.s[${i}].b[${j}].c=this.value">`:''}
 ${b.t=='img'&&assets?`<input type="file" accept="image/*" onchange="up(this,${i},${j})">`:''}
 <div class="tools"><button class="g" onclick="mb(${i},${j},-1)">↑</button><button class="g" onclick="mb(${i},${j},1)">↓</button><button class="d" onclick="D.s[${i}].b.splice(${j},1);render()">Excluir bloco</button></div></div>`).join('')+
 `<button class="g" onclick="D.s[${i}].b.push({t:'text',v:''});render()">+ Adicionar bloco</button>`}
function mv(i,d){const j=i+d;if(j<1||j>=D.s.length)return;[D.s[i],D.s[j]]=[D.s[j],D.s[i]];render()}
function mb(i,j,d){const a=D.s[i].b,k=j+d;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];render()}
function delS(i){if(confirm('Excluir esta seção?')){D.s.splice(i,1);render()}}
async function up(el,i,j){try{const r=await assets.upload(el.files[0]);D.s[i].b[j].v=r.url;render()}catch(e){alert('Falha no envio da imagem.')}}
function bar(){const b=$('#bar');if(!admin){b.style.display='none';return}b.style.display='flex';
 b.innerHTML=editing?'<button class="g" onclick="addS()">+ Nova seção</button><button onclick="pub()">Publicar alterações</button><button class="g" onclick="location.reload()">Descartar</button>':'<span>Área do editor</span><button onclick="editing=true;render()">Editar conteúdo</button>'}
function addS(){const t=prompt('Título da nova seção:');if(!t)return;let id=slug(t);D.s.splice(D.s.length-1,0,{id,n:t.slice(0,22),t,b:[{t:'text',v:''}]});render();location.hash=id}
async function pub(){if(!artifact)return alert('Publicação indisponível nesta conta.');
 const c=document.documentElement.cloneNode(true);
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 ['#nav','#app','#bar'].forEach(s=>c.querySelector(s).innerHTML='');c.querySelector('#bar').removeAttribute('style');
 try{await artifact.publish('<!doctype html>\n'+c.outerHTML)}catch(e){if(e&&e.code!='conflict')alert('Não foi possível publicar: '+(e.message||e.code))}}
render();
(async()=>{try{const u=await claude.use('user');admin=!!(u&&u.canEdit());if(admin){artifact=await claude.use('artifact');assets=await claude.use('assets');bar()}}catch(e){}})();
</script></body></html>
